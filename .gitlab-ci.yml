# GitLab CI pipeline for OmniLang — mirrors .github/workflows/ci.yml.
# Lints, tests the Rust workspace + TypeScript runtime, runs the project
# convention gates, and runs the mock-LLM multi-target conformance matrix.

stages:
  - lint
  - test
  - e2e

variables:
  CARGO_TERM_COLOR: "always"

default:
  image: "rust:1.85"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/

fmt-clippy:
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings

# Project conventions live in scripts/gates/, not in this file — the same
# command runs locally, on GitHub and here.
convention-gates:
  stage: lint
  script:
    - apt-get update && apt-get install -y python3
    - cargo build --release --bin omni
    - export OMNI="$CI_PROJECT_DIR/target/release/omni"
    - export BASE_REF="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-origin/main}"
    - ./scripts/gates/run-all.sh

cargo-test:
  stage: test
  script:
    - apt-get update && apt-get install -y z3
    - cargo test --workspace --locked
    # Generated TS types and IR schema must not drift from the Rust IR.
    - git diff --exit-code runtime/src/types.ts runtime/src/ir.schema.json

# The runtime integration suite builds the reference spec on all four targets,
# so it needs the same toolchains as the conformance matrix — a bare node image
# fails on the first Rust/Python/Go build.
runtime-test:
  stage: test
  script:
    - apt-get update && apt-get install -y z3 nodejs npm golang python3 python3-pip
    - pip install --quiet --break-system-packages pytest
    - npm ci --prefix runtime
    - npm run build --prefix runtime
    # Coverage thresholds in runtime/jest.config.js only apply with --coverage.
    - npm test --prefix runtime -- --coverage

dependency-audit:
  stage: test
  image: "node:20"
  script:
    - npm audit --audit-level=high --prefix runtime

conformance-matrix:
  stage: e2e
  script:
    - apt-get update && apt-get install -y z3 nodejs npm golang python3 python3-pip
    - pip install --quiet --break-system-packages pytest
    - npm ci --prefix runtime && npm run build --prefix runtime
    - cargo build --bin omni
    - |
      for target in typescript rust python go; do
        echo "hybrid_billing -> $target"
        OMNI_MOCK_LLM=true cargo run --bin omni -- build examples/hybrid_billing.omni --target "$target"
      done
