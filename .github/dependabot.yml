version: 2
updates:
  # Actions are the least-watched dependency in any repo: they run with a token
  # and nobody reads their diffs. Weekly bumps keep the surface small.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
