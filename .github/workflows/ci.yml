name: OmniLang CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Project conventions that no compiler enforces. Kept in scripts/gates/ so the
  # same command runs on a laptop and here — a rule that only exists in this YAML
  # file is a rule nobody can run before pushing.
  gates:
    name: Convention Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/gates/changelog.sh diffs against the merge base.
          fetch-depth: 0

      - name: Setup OmniLang
        uses: ./.github/actions/setup-omni

      - name: Run all convention gates
        env:
          OMNI: ${{ github.workspace }}/target/release/omni
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/gates/run-all.sh

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OmniLang
        uses: ./.github/actions/setup-omni

      - name: Install Z3 SMT Solver
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --locked fails if Cargo.lock is stale, which is what makes the committed
      # lock a reproducibility guarantee instead of a suggestion.
      - name: Run tests
        run: cargo test --workspace --locked

      # The exporter tests regenerate runtime/src/types.ts and ir.schema.json from
      # the Rust IR types on every `cargo test` run. If the committed files no
      # longer match, the Rust IR and the TypeScript runtime have drifted apart.
      - name: Verify generated TypeScript types and IR schema are up to date
        run: git diff --exit-code runtime/src/types.ts runtime/src/ir.schema.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: runtime/package-lock.json

      - name: Install Runtime dependencies
        run: npm ci --prefix runtime

      - name: Build Runtime
        run: npm run build --prefix runtime

      # The runtime integration suite builds the reference spec on all four
      # targets, so every target toolchain must exist BEFORE it runs. From
      # 2026-08-06 to 2026-09-20 these steps sat after the test step: the Python
      # build failed on a missing pytest, the suite printed only
      # "Expected: 0, Received: 1", and main stayed red for six weeks while the
      # changelog said CI was fixed.
      - name: Set up Go (runtime suite + conformance matrix)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python (runtime suite + conformance matrix)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: python3 -m pip install --quiet pytest

      # Coverage thresholds live in runtime/jest.config.js; --coverage is what
      # activates them, so this step is the gate, not a report.
      - name: Run Runtime tests with coverage
        run: npm test --prefix runtime -- --coverage

      - name: Run mock E2E build verification
        run: |
          OMNI_MOCK_LLM=true cargo run --bin omni -- build examples/stabilization_test.schema.omni --target typescript
          OMNI_MOCK_LLM=true cargo run --bin omni -- build examples/hybrid_billing.omni --target typescript

      # Multi-target parity: the same spec must build + verify on all four targets.
      - name: Run multi-target conformance matrix (mock LLM)
        run: |
          for target in typescript rust python go; do
            echo "::group::hybrid_billing -> $target"
            OMNI_MOCK_LLM=true cargo run --bin omni -- build examples/hybrid_billing.omni --target "$target"
            echo "::endgroup::"
          done

      # The `secrets` context is NOT available in a step-level `if:` — using it
      # there is a workflow validation error that fails the whole run at 0s with
      # no jobs and no logs. That is what killed this pipeline from 2026-05-26 to
      # 2026-08-06. Branch inside the step instead, and announce the skip.
      - name: Run E2E Integration Test with Real LLM (Conditional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::notice title=Real-LLM E2E skipped::ANTHROPIC_API_KEY is not set for this run"
            exit 0
          fi
          NODE_PATH=runtime/node_modules npx ts-node --project runtime/tsconfig.json scripts/test-real-llm.ts

  deps:
    name: Dependencies & Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # rustsec/audit-check publishes advisories as a check run
      issues: write # …and opens an issue for advisories found on a push
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --prefix runtime

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, gates, deps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Setup OmniLang
        uses: ./.github/actions/setup-omni

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: omni-binaries
          path: |
            target/release/omni
            target/release/omni-lsp
